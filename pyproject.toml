[project]
name = "job-finder"
version = "0.1.0"
description = "A simple BeautifulSoup scraper for public LinkedIn job searches"
readme = "README.md"
authors = [
    { name = "AbelHaro", email = "abelh2003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.14.1",
]

[project.scripts]
job-finder = "job_finder.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
